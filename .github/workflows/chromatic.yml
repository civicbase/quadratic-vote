name: Chromatic

# Publishes the Storybook and runs visual regression against the last accepted
# baseline. Needs a CHROMATIC_PROJECT_TOKEN repository secret; without it the
# job fails at the publish step rather than silently doing nothing.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  chromatic:
    name: Publish Storybook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Chromatic reads git history to work out the baseline to compare
        # against. A shallow clone leaves it with nothing to diff, so it treats
        # every story as new on every run.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The Chromatic CLI requires Node 20+; 22 matches the top of the CI
          # matrix. It is not a devDependency — chromaui/action brings its own,
          # and adding it to the tree pulled native bindings whose nested
          # optional deps npm failed to record for Linux, breaking `npm ci`.
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check stories
        run: npm run type-check:storybook

      - name: Publish to Chromatic
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Snapshot changes are reported, not fatal — the review happens in
          # Chromatic. Build or story errors still fail the job.
          exitZeroOnChanges: true
          onlyChanged: true
